name: Stylelint

on: pull_request

permissions:
  actions: none
  checks: none
  contents: none
  deployments: none
  issues: none
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  phpcs:
    name: stylelinter
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          persist-credentials: false
      - name: stylelint
        run: |
          npm install --ignore-scripts
          npx stylelint "**/*.{css,less}" -f github
